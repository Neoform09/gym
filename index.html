<div id="appsync" hidden>
  <b>Send this log to Claude</b>
  <p class="as-msg" id="appsync-msg">Enter your password once. After that, everything you save is sent automatically.</p>
  <div class="as-row"><input id="appsync-pass" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="password" aria-label="Password"><button id="appsync-save" type="button">Save</button><button id="appsync-later" class="as-x" type="button">Later</button></div>
</div>
<script>
// Sends saved entries to Igor's "App Logs" Google Sheet. Shared by all his phone apps.
window.AppSync = (function () {
  var URL = "https://script.google.com/macros/s/AKfycbztATiu4PQzOnIuSqcF1AocXGo1RfsupmiqJVyFjFSRJUl5Jb_bS2Y8YTTcJ5IZwO19YQ/exec";
  var KQ = "appsync-queue", KP = "appsync-pass", KL = "appsync-later";
  function get(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var busy = false, box, msg;

  function showBox(text) {
    if (!box) return;
    if (text) msg.textContent = text;
    box.hidden = false;
  }
  function setup() {
    box = document.getElementById("appsync"); msg = document.getElementById("appsync-msg");
    if (!box) return;
    if (box.parentNode !== document.body || document.body.firstElementChild !== box) document.body.insertBefore(box, document.body.firstChild);
    document.getElementById("appsync-save").addEventListener("click", function () {
      var p = document.getElementById("appsync-pass").value.trim().toLowerCase();
      if (!p) return;
      put(KP, p); put(KL, 0); box.hidden = true; msg.textContent = "Checking…";
      check();
    });
    document.getElementById("appsync-later").addEventListener("click", function () { put(KL, Date.now()); box.hidden = true; });
    if (!get(KP, "") && Date.now() - get(KL, 0) > 12 * 3600 * 1000) showBox();
    setTimeout(flush, 1500);
  }

  function post(body) {
    return fetch(URL, { method: "POST", body: JSON.stringify(body) }).then(function (r) { return r.json(); });
  }
  // Called after a password is typed: confirms it right away, even with nothing to send.
  function check() {
    var pass = get(KP, "");
    post({ key: pass, app: "_check", id: "check" }).then(function (r) {
      if (r && r.error === "password") { put(KP, ""); showBox("That password didn't work. Please type it again."); return; }
      flush();
    }).catch(function () { flush(); });
  }

  function send(app, entry) {
    if (!entry || !entry.id) return;
    var q = get(KQ, []).filter(function (x) { return !(x.app === app && x.id === entry.id); });
    q.push({ app: app, id: String(entry.id), date: entry.date || "", summary: entry.summary || "", details: entry.details || {} });
    put(KQ, q.slice(-500));
    flush();
  }

  function flush() {
    if (busy) return;
    var q = get(KQ, []);
    if (!q.length) return;
    var pass = get(KP, "");
    if (!pass) { if (Date.now() - get(KL, 0) > 12 * 3600 * 1000) showBox(); return; }
    if (navigator.onLine === false) return;
    busy = true;
    var item = q[0];
    post({ key: pass, app: item.app, id: item.id, date: item.date, summary: item.summary, details: item.details })
      .then(function (r) {
        busy = false;
        if (r && r.ok) {
          put(KQ, get(KQ, []).filter(function (x) { return !(x.app === item.app && x.id === item.id && x.summary === item.summary); }));
          flush();
        } else if (r && r.error === "password") {
          put(KP, ""); showBox("That password didn't work. Please type it again.");
        }
      })
      .catch(function () { busy = false; });
  }

  // Sends an app's existing history once, the first time this code runs on the phone.
  function backfill(name, fn) {
    if (get("appsync-bf-" + name, 0)) return;
    try { fn(); put("appsync-bf-" + name, 1); } catch (e) {}
  }

  window.addEventListener("online", flush);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") flush(); });
  setInterval(flush, 60000);
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", setup); else setup();
  return { send: send, flush: flush, backfill: backfill };
})();
</script>


<title>Igor's Gym Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — sticky header with day tabs + phase switch, stacked exercise cards, sticky rest-timer bar. */
:root {
  --bg: #f3f1ec; --panel: #ffffff; --ink: #1c1b19; --muted: #6f6b63; --line: #e1ddd3;
  --accent: #c8643b; --accent-ink: #ffffff; --soft: #f7ede7; --good: #2f8a55;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161513; --panel: #211f1c; --ink: #eeebe4; --muted: #a29d93; --line: #35322d;
  --accent: #e3855c; --accent-ink: #1a1816; --soft: #2d231e; --good: #5cc48a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161513; --panel: #211f1c; --ink: #eeebe4; --muted: #a29d93; --line: #35322d;
  --accent: #e3855c; --accent-ink: #1a1816; --soft: #2d231e; --good: #5cc48a; color-scheme: dark }
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 28px/1.35 var(--body); margin: 0; padding-bottom: 130px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
header { position: relative; background: var(--bg); border-bottom: 2px solid var(--line); }
header .wrap { padding-block: 10px; display: grid; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h1 { font: 800 40px/1 var(--display); letter-spacing: .01em; margin: 0; text-transform: uppercase; }
h1 span { color: var(--accent); }
.status { margin-left: auto; font-size: 20px; color: var(--muted); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tab { border: 2px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 14px; padding: 10px 8px; font: 800 32px/1.05 var(--display); text-transform: uppercase; letter-spacing: .02em; cursor: pointer; }
.tab small { display: block; font: 600 20px/1.2 var(--body); text-transform: none; letter-spacing: 0; color: var(--muted); margin-top: 2px; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab[aria-selected="true"] small { color: var(--accent-ink); opacity: .9; }
.phase { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.phase .lbl { font-size: 20px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; width: 100%; }
.chip { border: 2px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 14px; font: 700 24px var(--body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
main .wrap { padding-block: 16px; display: grid; gap: 20px; }
.dayhead h2 { font: 800 44px/1 var(--display); text-transform: uppercase; margin: 0; text-wrap: balance; }
.dayhead p { margin: 8px 0 0; color: var(--muted); font-size: 24px; }
.note { background: var(--soft); border-radius: 14px; padding: 14px 16px; font-size: 26px; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; overflow: hidden; }
.pics { display: grid; grid-template-columns: 1fr 1fr; }
.pics img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; }
.body { padding: 16px 16px 18px; display: grid; gap: 14px; min-width: 0; }
.top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.num { font: 800 38px/1 var(--display); color: var(--accent); }
.name { font: 800 34px/1.05 var(--display); text-transform: uppercase; letter-spacing: .01em; overflow-wrap: anywhere; min-width: 0; }
.mus { color: var(--muted); font-size: 24px; width: 100%; }
.flag { font-size: 20px; font-weight: 800; color: var(--accent); border: 2px solid var(--accent); border-radius: 999px; padding: 2px 12px; text-transform: uppercase; letter-spacing: .03em; }
.rx { border-left: 6px solid var(--accent); padding: 4px 0 4px 14px; }
.rx b { display: block; font: 800 42px/1.1 var(--display); letter-spacing: .01em; }
.rx span { font-size: 26px; color: var(--muted); }
ul.cues { margin: 0; padding-left: 30px; font-size: 27px; color: var(--ink); display: grid; gap: 8px; }
.log { display: grid; gap: 12px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center; }
.row .s { grid-column: 1 / -1; font: 800 26px var(--display); color: var(--muted); text-transform: uppercase; margin-bottom: -4px; }
.field { display: flex; align-items: center; border: 2px solid var(--line); border-radius: 14px; background: var(--bg); padding: 0 12px; min-width: 0; }
.field input { border: 0; background: transparent; color: var(--ink); font: 700 34px var(--body); width: 100%; padding: 10px 0; font-variant-numeric: tabular-nums; min-width: 0; }
.field span { color: var(--muted); font-size: 22px; margin-left: 6px; white-space: nowrap; }
.last { font-size: 25px; color: var(--muted); }
.last b { color: var(--ink); font-weight: 700; }
.saveb { width: 100%; border: 0; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 16px 18px; font: 800 30px var(--body); cursor: pointer; }
.saveb.ok { background: var(--good); color: #fff; }
.hist { display: grid; gap: 14px; }
.hcard { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.hcard h3 { margin: 0 0 8px; font: 800 32px var(--display); text-transform: uppercase; }
.hcard div { font-size: 25px; display: grid; gap: 2px; border-top: 2px solid var(--line); padding: 8px 0; }
.hcard div span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: 27px; padding: 20px 0; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--panel); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bar .wrap { padding-block: 10px; display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 8px; align-items: center; }
.timer { font: 800 48px/1 var(--display); font-variant-numeric: tabular-nums; min-width: 92px; }
.timer.run { color: var(--accent); }
.bar button { border: 2px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 14px; padding: 14px 6px; font: 800 26px var(--body); cursor: pointer; }
.bar .lbl { display: none; }
@media (prefers-reduced-motion: no-preference) { .saveb { transition: background .2s; } }
</style>

const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },

const pad = n => String(n).padStart(2, '0');

function setStatus(t) { $('#status').textContent = t; }

function renderTabs() {
  $('#tabs').innerHTML = DAYS.map(d => `<button class="tab" role="tab" data-v="${d.key}" aria-selected="${view === d.key}">Day ${d.key}<small>${esc(d.day.slice(0,3))} · ${esc(d.title.split(' + ')[0])}</small></button>`).join('')

}

function lastFor(exId, day) {
  for (const s of sessions) {
    if (s.date === today() && s.day === day) continue;
    const sets = s.ex && s.ex[exId];
    if (sets && sets.some(x => x.kg || x.reps)) return { date: s.date, sets };
  }
  return null;
}
function current(day) { return sessions.find(s => s.date === today() && s.day === day); }
const fmtSets = sets => sets.filter(x => x.kg || x.reps).map(x => `${x.kg || '–'} kg × ${x.reps || '–'}`).join(', ');

function renderDay(d) {
  const cur = current(d.key);
  const cards = d.ex.map((e, n) => {
    const [main, sub] = e.presc[phase];
    const count = e.sets[phase];
    const done = cur && cur.ex && cur.ex[e.id] || [];
    const last = lastFor(e.id, d.key);
    const rows = Array.from({ length: count }, (_, k) => `
      <div class="row"><div class="s">Set ${k + 1}</div>
        <label class="field"><input id="${d.key}-${e.id}-kg-${k}" inputmode="decimal" placeholder="–" value="${esc(done[k]?.kg ?? '')}" aria-label="Set ${k+1} weight"><span>kg</span></label>
        <label class="field"><input id="${d.key}-${e.id}-r-${k}" inputmode="numeric" placeholder="–" value="${esc(done[k]?.reps ?? '')}" aria-label="Set ${k+1} reps"><span>${e.perSide ? 'reps/side' : 'reps'}</span></label>
      </div>`).join('');
    return `<article class="card">
      <div class="pics"><img src="${e.img[0]}" alt="${esc(e.name)} start position"><img src="${e.img[1]}" alt="${esc(e.name)} end position"></div>
      <div class="body">
        <div class="top"><span class="num">${n + 1}</span><span class="name">${esc(e.name)}</span>${e.flag ? `<span class="flag">${esc(e.flag)}</span>` : ''}<span class="mus">${esc(e.mus)}</span></div>
        <div class="rx"><b>${esc(main)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</div>
        <ul class="cues">${e.cues.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
        <div class="last">${last ? `Last time (${esc(niceDate(last.date))}): <b>${esc(fmtSets(last.sets))}</b> — beat it.` : 'No previous log yet — write down what you lift today.'}</div>
        <div class="log">${rows}</div>
        <button class="saveb" type="button" data-save="${esc(e.id)}" data-count="${count}">${done.some(x => x.kg || x.reps) ? 'Saved ✓ — update' : 'Save sets'}</button>
      </div></article>`;
  }).join('');
  return `<section class="dayhead"><h2>Day ${d.key} · ${esc(d.title)}</h2><p>${esc(d.day)} · ${esc(d.sub)}<br>Warm-up 5–8 min bike or rower · rest 2–3 min · reps 2 s up, 3–4 s down</p></section>
    ${d.note ? `<div class="note">${esc(d.note)}</div>` : ''}${cards}`;
}

function renderHistory() {
  if (!sessions.length) return `<section class="dayhead"><h2>Training log</h2></section><div class="empty">Nothing logged yet. Open today's day, enter weight and reps, and tap <b>Save sets</b> — every workout shows up here, newest first.</div>`;
  const names = {}; DAYS.forEach(d => d.ex.forEach(e => names[e.id] = e.name));
  return `<section class="dayhead"><h2>Training log</h2><p>${sessions.length} workout${sessions.length > 1 ? 's' : ''} logged</p></section><div class="hist">` +
    sessions.slice(0, 60).map(s => `<div class="hcard"><h3>${esc(niceDate(s.date))} · Day ${esc(s.day)} <span style="color:var(--muted);font-weight:600">${esc(PHASES[s.phase] || '')}</span></h3>
      ${Object.entries(s.ex || {}).filter(([, v]) => v.some(x => x.kg || x.reps)).map(([k, v]) => `<div><span>${esc(names[k] || k)}</span><span>${esc(fmtSets(v))}</span></div>`).join('')}</div>`).join('') + '</div>';
}

function render() {
  renderTabs();
  const d = DAYS.find(x => x.key === view);
  const keep = {};
  document.querySelectorAll('#main input').forEach(i => { if (i.value) keep[i.id] = i.value; });
  $('#main').innerHTML = d ? renderDay(d) : renderHistory();
  for (const [id, v] of Object.entries(keep)) { const el = document.getElementById(id); if (el) el.value = v; }
}

async function saveExercise(dayKey, exId, count, btn) {
  const sets = [];
  for (let k = 0; k < count; k++) {
    const kg = $(`#${CSS.escape(`${dayKey}-${exId}-kg-${k}`)}`).value.trim().replace(',', '.');
    const reps = $(`#${CSS.escape(`${dayKey}-${exId}-r-${k}`)}`).value.trim();
    sets.push({ kg, reps });
  }
  const id = `${today()}_${dayKey}`;
  let s = sessions.find(x => x.id === id);
  s = s ? JSON.parse(JSON.stringify(s)) : { id, date: today(), day: dayKey, phase, ex: {} };
  s.ex[exId] = sets; s.phase = phase; s.updatedAt = new Date().toISOString();
  btn.textContent = 'Saving…';
  writeChain = writeChain.then(async () => {
    try {
      if (dbOk) { const { id: _, ...body } = s; await db.collection('sessions').doc(id).set(body); }
      else { const all = store.get('gym-sessions', []).filter(x => x.id !== id); all.push(s); store.set('gym-sessions', all); loadLocal(); }
      btn.textContent = 'Saved ✓'; btn.classList.add('ok');
      syncSession(s);
    } catch (e) {
      btn.textContent = e && e.code === 'quota_exceeded' ? 'Log is full' : 'Not saved — tap again';
    }
  });
}

function gymEntry(s) {
  const names = {}; DAYS.forEach(d => d.ex.forEach(e => names[e.id] = e.name));
  const used = Object.entries(s.ex || {}).filter(([, v]) => v.some(x => x.kg || x.reps));
  const d = DAYS.find(x => x.key === s.day);
  const sets = {}; used.forEach(([k, v]) => sets[names[k] || k] = v.filter(x => x.kg || x.reps));
  return { id: 'gym-' + s.id, date: s.date,
    summary: `Day ${s.day}${d ? ' (' + d.title + ')' : ''}, ${PHASES[s.phase] || ''}: ` + used.map(([k, v]) => `${names[k] || k} ${fmtSets(v)}`).join('; '),
    details: { day: s.day, phase: PHASES[s.phase] || '', sets } };
}
function syncSession(s) { try { if (window.AppSync) AppSync.send('Gym', gymEntry(s)); } catch (e) {} }

function loadLocal() {
  sessions = store.get('gym-sessions', []).sort((a, b) => (b.date + b.day).localeCompare(a.date + a.day));
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-v]');
  if (t) { view = t.dataset.v; store.set('gym-view', view); render(); window.scrollTo(0, document.querySelector('main').offsetTop - 8); return; }
  const p = e.target.closest('[data-p]');
  if (p) { phase = Number(p.dataset.p); store.set('gym-phase', phase); render(); return; }
  const s = e.target.closest('[data-save]');
  if (s) saveExercise(view, s.dataset.save, Number(s.dataset.count), s);
});

// rest timer
let tEnd = 0, tInt = null, lock = null;
function tick() {
  const left = Math.max(0, Math.round((tEnd - Date.now()) / 1000));
  $('#timer').textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`;
  $('#timer').classList.toggle('run', left > 0);
  if (!left) { clearInterval(tInt); tInt = null; try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {} if (lock) { lock.release().catch(() => {}); lock = null; } }
}
async function startTimer(sec) {
  tEnd = Date.now() + sec * 1000; clearInterval(tInt); tInt = setInterval(tick, 250); tick();
  try { lock = await navigator.wakeLock.request('screen'); } catch (e) { lock = null; }
}
$('#t2').onclick = () => startTimer(120);
$('#t3').onclick = () => startTimer(180);
$('#tx').onclick = () => { tEnd = Date.now(); tick(); };

loadLocal();
render();
if (window.AppSync) AppSync.backfill('gym', () => store.get('gym-sessions', []).forEach(syncSession));
setStatus('Log on this phone');
(async () => {
  try { db = await (window.claude && window.claude.use ? window.claude.use('db') : null); } catch (e) { db = null; }
  if (!db) { setStatus('Log saved on this phone only'); return; }
  dbOk = true; setStatus('Log synced');
  db.collection('sessions').orderBy('date', 'desc').limit(300).onSnapshot(snap => {
    sessions = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.date + b.day).localeCompare(a.date + a.day));
    const focused = document.activeElement && document.activeElement.tagName === 'INPUT';
    if (!focused) render();
  }, err => { dbOk = false; setStatus('Log offline — saving on this phone'); });
})();
</script>

</body></html>
